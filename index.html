    }

    .score-box {
      width: 48%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(1.8rem, 8vw, 3rem);
      font-weight: 900;
      line-height: 1;
    }

    .score-lula {
      color: #ff1e27;
      text-shadow: 0 0 8px rgba(255, 30, 39, 0.75);
    }

    .score-flavio {
      color: #0075ff;
      text-shadow: 0 0 8px rgba(0, 117, 255, 0.75);
    }

    .btn-overlay {
      position: absolute;
      background: transparent;
      border: none;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-overlay:active {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 8px;
    }

    #btn-rosa-vermelha {
      top: 55.3%;
      left: 13.5%;
      width: 35.8%;
      height: 15.2%;
    }

    #btn-rosa-branca {
      top: 55.3%;
      left: 50.7%;
      width: 35.8%;
      height: 15.2%;
    }

    #btn-galaxia {
      top: 71.5%;
      left: 13.5%;
      width: 35.8%;
      height: 15.2%;
    }

    #btn-pianista {
      top: 71.5%;
      left: 50.7%;
      width: 35.8%;
      height: 15.2%;
    }

    #btn-zerar {
      top: 90.3%;
      left: 13.5%;
      width: 73%;
      height: 4.8%;
    }

    body.modo-exibicao .btn-overlay {
      display: none;
    }

    .status {
      position: fixed;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 12px;
      z-index: 10;
      pointer-events: none;
    }

    body.modo-exibicao .status {
      display: none;
    }
  </style>
</head>
<body>
  <div id="status" class="status">Conectando ao placar...</div>

  <div class="live-container">
    <div class="score-display">
      <div id="votos-lula" class="score-box score-lula">0</div>
      <div id="votos-flavio" class="score-box score-flavio">0</div>
    </div>

    <button id="btn-rosa-vermelha" class="btn-overlay" aria-label="Adicionar 1 voto para Lula"></button>
    <button id="btn-rosa-branca" class="btn-overlay" aria-label="Adicionar 1 voto para Flávio"></button>
    <button id="btn-galaxia" class="btn-overlay" aria-label="Adicionar 1000 votos para Lula"></button>
    <button id="btn-pianista" class="btn-overlay" aria-label="Adicionar 1000 votos para Flávio"></button>
    <button id="btn-zerar" class="btn-overlay" aria-label="Zerar placar"></button>
  </div>

  <script>
    const elLula = document.getElementById('votos-lula');
    const elFlavio = document.getElementById('votos-flavio');
    const statusEl = document.getElementById('status');
    const canalPlacar = new BroadcastChannel('placar55-sincronizacao');

    let estadoAtual = { lula: 0, flavio: 0 };

    function normalizarEstado(estado) {
      return {
        lula: Math.max(0, Number(estado?.lula ?? 0)),
        flavio: Math.max(0, Number(estado?.flavio ?? 0))
      };
    }

    function atualizarTela() {
      elLula.textContent = estadoAtual.lula.toLocaleString('pt-BR');
      elFlavio.textContent = estadoAtual.flavio.toLocaleString('pt-BR');
    }

    function aplicarEstado(estado) {
      estadoAtual = normalizarEstado(estado);
      atualizarTela();
    }

    function transmitirEstado() {
      canalPlacar.postMessage({ tipo: 'atualizar-placar', estado: estadoAtual });
    }

    function adicionarVotos(candidato, quantidade) {
      const novoEstado = { ...estadoAtual };
      novoEstado[candidato] = Math.max(0, Number(novoEstado[candidato] ?? 0) + Number(quantidade ?? 0));
      aplicarEstado(novoEstado);
      transmitirEstado();
    }

    function zerarPlacar() {
      aplicarEstado({ lula: 0, flavio: 0 });
      transmitirEstado();
    }

    canalPlacar.onmessage = (evento) => {
      const mensagem = evento.data;
      if (!mensagem || !mensagem.tipo) return;

      if (mensagem.tipo === 'atualizar-placar') {
        aplicarEstado(mensagem.estado);
      }

      if (mensagem.tipo === 'solicitar-estado') {
        canalPlacar.postMessage({ tipo: 'atualizar-placar', estado: estadoAtual });
      }
    };

    document.getElementById('btn-rosa-vermelha').addEventListener('click', () => adicionarVotos('lula', 1));
    document.getElementById('btn-rosa-branca').addEventListener('click', () => adicionarVotos('flavio', 1));
    document.getElementById('btn-galaxia').addEventListener('click', () => adicionarVotos('lula', 1000));
    document.getElementById('btn-pianista').addEventListener('click', () => adicionarVotos('flavio', 1000));
    document.getElementById('btn-zerar').addEventListener('click', zerarPlacar);

    atualizarTela();
    if (statusEl) statusEl.textContent = 'Placar sincronizado localmente';
    canalPlacar.postMessage({ tipo: 'solicitar-estado' });

    window.addEventListener('beforeunload', () => canalPlacar.close());
  </script>
</body>
</html>
